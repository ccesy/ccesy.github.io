  - name: 一、让两台相机看到同一时刻
    lessons:
      - [1, 双目成像与视差, 用焦距和基线估算一米外目标的视差，再用一对照片核对。]
      - [2, 采集成对图像, 同时拍静止和横向移动的目标，观察左右帧时间差带来的误差。]
  - name: 二、让同一个点落到同一行
    lessons:
      - [3, 双目标定, 用多组棋盘格图像估计内参和相对位姿，检查基线长度与单位。]
      - [4, 极线校正, 给校正后的图像叠加水平线，在画面中央和边缘检查同名点的纵向偏差。]
  - name: 三、从像素匹配到米制点云
    lessons:
      - [5, 从块匹配到 SGBM, 先用灰度块匹配找一个点，再生成整幅视差图，观察白墙和遮挡边缘。]
      - [6, 深度与点云, 用校正参数重投影视差，剔除无效点，用已知距离的平面核对尺度。]
  - name: 四、上机器人验证
    lessons:
      - [7, 精度评估, 在不同距离对比实测值，分别记录深度误差和有效像素比例。]
      - [8, ROS 2 与 Jetson 部署, 发布深度图和点云，分别测量采集到发布的延迟与输出帧率。]
