include:
  - _notes
plugins:
  - jekyll-optional-front-matter
defaults:
  - scope:
      path: "_notes"
      type: pages
    values:
      layout: notebook
      notebook_note: true
  - scope:
      path: "_notes/stereo-vision/*.md"
      type: pages
    values:
      series: 计算机视觉（CV）
      stereo_article: true
      permalink: /notes/stereo-vision/:basename/
